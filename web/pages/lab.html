<!--{"slug":"lab","title":"Lab","description":"Shape an options market with sliders and watch the real implied.js script paint its distribution, live in your browser.","scripts":["core","engine","charts","results","pages/lab"]}-->
<section class="wrap page-head">
  <div class="crumbs mono"><a href="/">Implied</a><span>/</span><span>Lab</span></div>
  <h1 class="display">The Lab</h1>
  <p>shape a market. the real script repaints it.</p>
</section>

<section class="wrap grid-app results-first">
  <form class="panel" id="controls" aria-label="Market settings">
    <h2>Market</h2>
    <div class="seg" role="group" aria-label="Preset">
      <button type="button" data-preset="index" aria-pressed="true">Index</button>
      <button type="button" data-preset="earnings" aria-pressed="false">Earnings</button>
      <button type="button" data-preset="meme" aria-pressed="false">High IV</button>
      <button type="button" data-preset="bell" aria-pressed="false">Bell curve</button>
    </div>
    <div class="field"><label for="S">Spot price <output data-for="S"></output></label><input type="range" id="S" min="10" max="1000" step="1"></div>
    <div class="field"><label for="vol">Volatility <output data-for="vol"></output></label><input type="range" id="vol" min="8" max="150" step="1"></div>
    <div class="field"><label for="skew">Skew <output data-for="skew"></output></label><input type="range" id="skew" min="-0.8" max="0.8" step="0.05"></div>
    <div class="field"><label for="curv">Smile curvature <output data-for="curv"></output></label><input type="range" id="curv" min="0" max="3" step="0.1"></div>
    <div class="field"><label for="move">Earnings move <output data-for="move"></output></label><input type="range" id="move" min="0" max="15" step="0.5"></div>
    <div class="field"><label for="eDay">Earnings in <output data-for="eDay"></output></label><input type="range" id="eDay" min="1" max="60" step="1"></div>
    <div class="field"><label for="spreadPct">Bid-ask spread <output data-for="spreadPct"></output></label><input type="range" id="spreadPct" min="0.5" max="15" step="0.5"></div>
    <div class="sep"></div>
    <h2>Indicator settings</h2>
    <div class="field"><label for="expirations">Expirations to project <output data-for="expirations"></output></label><input type="range" id="expirations" min="1" max="8" step="1"></div>
    <label class="switch">Show Fork <input type="checkbox" id="showFork" checked></label>
    <button type="button" class="pill ghost sm" id="reseed">New quotes, same market</button>
  </form>

  <div class="stack">
    <div class="dark-card">
      <div class="chart-host" id="chart"></div>
      <div class="chart-bar"><div class="chips" id="chips"></div><span class="mono" id="status" role="status">Loading implied.js…</span></div>
    </div>
    <div class="table-wrap" id="table"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="pill solid" id="analyze">Open this chain in Analyze <span class="arr">↗</span></button>
      <button class="pill" id="download">Download chain JSON</button>
      <a class="pill ghost" href="/how-it-works/">See each step <span class="arr">↗</span></a>
    </div>
  </div>
</section>
