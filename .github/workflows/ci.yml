name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      # The stress numbers quoted in the README and on the site must match a fresh run.
      - run: npm run stress -- --write
      - run: git diff --exit-code docs/stress.json
      - run: npm run site
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run site
      - run: node tools/smoke.js
